<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <!-- N'karamögö · G-Étudie — vignette par défaut du CEE (DESIGN.md § 8) :
       l'ardoise de l'écolier et son crayon. Dessin original. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .05  0 0 0 .08 0"/>
    </filter>
  </defs>
  <rect width="360" height="220" fill="#FFEBB3"/>
  <circle cx="276" cy="64" r="92" fill="#FFDC7A"/>
  <g fill="none" stroke="#FFF7E0" stroke-width="1.5">
    <circle cx="276" cy="64" r="112" stroke-opacity=".7"/>
    <circle cx="276" cy="64" r="134" stroke-opacity=".45"/>
  </g>

  <!-- L'ardoise -->
  <g transform="rotate(-4 160 118)">
    <rect x="58" y="44" width="204" height="146" rx="12" fill="#A85A24"/>
    <rect x="58" y="44" width="204" height="146" rx="12" fill="none" stroke="#7A3A12" stroke-opacity=".35" stroke-width="2"/>
    <rect x="70" y="56" width="180" height="122" rx="5" fill="#2F2A27"/>
    <g fill="none" stroke="#FFF7EE" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".88" stroke-width="2.6">
      <!-- un triangle rectangle et son angle droit -->
      <path d="M92 156V100L148 156Z"/>
      <path d="M92 144h12v12"/>
      <!-- des lignes d'écriture à la craie -->
      <path d="M166 92c6-6 10 4 16-2s9 4 15-1 10 3 16-1"/>
      <path d="M166 114c7-5 11 4 18-1s9 4 16 0"/>
      <path d="M166 136c6-5 10 3 16-1s8 4 14 0 8 3 14 0"/>
      <!-- une étoile, la bonne réponse -->
      <path d="M226 72l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" stroke="#FFC21A" stroke-opacity="1"/>
    </g>
    <!-- craie sur le rebord -->
    <rect x="186" y="182" width="26" height="7" rx="3.5" fill="#FFF7EE"/>
  </g>

  <!-- Le crayon -->
  <g transform="rotate(32 300 146)">
    <rect x="236" y="138" width="104" height="16" rx="2" fill="#F6641B"/>
    <rect x="236" y="138" width="104" height="5" fill="#FF8A4C"/>
    <rect x="326" y="138" width="10" height="16" fill="#C9BFB6"/>
    <rect x="336" y="138" width="12" height="16" rx="5" fill="#FEB295"/>
    <path d="M236 138l-22 8 22 8Z" fill="#F2C99D"/>
    <path d="M221 143.4l-7 2.6 7 2.6Z" fill="#2B140A"/>
  </g>

  <rect width="360" height="220" filter="url(#grain)"/>
</svg>
