<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <!-- N'karamögö · G-Étudie — vignette par défaut du BEPC (DESIGN.md § 8) :
       la pile de manuels, chacun à la couleur de sa matière, et l'équerre.
       Dessin original. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .08 0"/>
    </filter>
  </defs>
  <rect width="360" height="220" fill="#FFDCCB"/>
  <circle cx="84" cy="70" r="96" fill="#FEC0A4"/>
  <g fill="none" stroke="#FFF3EC" stroke-width="1.5">
    <circle cx="84" cy="70" r="116" stroke-opacity=".7"/>
    <circle cx="84" cy="70" r="138" stroke-opacity=".45"/>
  </g>
  <!-- le plan de la table -->
  <rect y="194" width="360" height="26" fill="#F7B796"/>

  <!-- La pile de manuels -->
  <g>
    <rect x="84" y="164" width="190" height="30" rx="4" fill="#3E4CAC"/>
    <rect x="96" y="168" width="172" height="5" rx="2" fill="#FFF7F2"/>
    <rect x="84" y="164" width="14" height="30" rx="3" fill="#303B88"/>

    <rect x="104" y="136" width="160" height="28" rx="4" fill="#057D73"/>
    <rect x="114" y="140" width="144" height="5" rx="2" fill="#FFF7F2"/>
    <rect x="250" y="136" width="14" height="28" rx="3" fill="#03665E"/>

    <rect x="94" y="110" width="168" height="26" rx="4" fill="#AC3780"/>
    <rect x="104" y="114" width="150" height="5" rx="2" fill="#FFF7F2"/>
    <rect x="94" y="110" width="14" height="26" rx="3" fill="#902969"/>
    <rect x="150" y="122" width="44" height="4" rx="2" fill="#FFF7F2" fill-opacity=".6"/>
  </g>

  <!-- L'équerre, posée contre la pile -->
  <g transform="translate(-16 0) rotate(-8 300 150)">
    <path d="M276 194V70l92 124Z" fill="#FFF7F2" fill-opacity=".75" stroke="#A63D02" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"/>
    <path d="M290 178v-58l44 58Z" fill="#FFDCCB" stroke="#A63D02" stroke-opacity=".35" stroke-width="1.5" stroke-linejoin="round"/>
    <g stroke="#A63D02" stroke-opacity=".6" stroke-width="1.5" stroke-linecap="round">
      <path d="M276 90h7M276 106h5M276 122h7M276 138h5M276 154h7M276 170h5"/>
    </g>
  </g>

  <!-- Un crayon sur la pile -->
  <g transform="rotate(-6 170 104)">
    <rect x="120" y="98" width="92" height="10" rx="2" fill="#FFC21A"/>
    <rect x="200" y="98" width="12" height="10" rx="4" fill="#FEB295"/>
    <path d="M120 98l-14 5 14 5Z" fill="#F2C99D"/>
    <path d="M110 101.6l-4 1.4 4 1.4Z" fill="#2B140A"/>
  </g>

  <rect width="360" height="220" filter="url(#grain)"/>
</svg>
